# Synthetic weather parameters for Poland (literature defaults; jobs/calibrate.py refits them in spec 002).
# All processes are keyed by (seed, location, variable, step); see src/ems/ingest/synthetic/weather.py.
temperature:
  annual_mean_c: 8.7            # PL mean ~8.7 C (IMGW 1991-2020)
  annual_amplitude_c: 10.0      # Jan ~ -1.3 C, Jul ~ 18.7 C
  coldest_day_of_year: 20
  continentality_c_per_deg_lon: 0.25   # amplitude grows eastwards
  lapse_c_per_m: 0.0065
  lat_gradient_c_per_deg: -0.3
  diurnal_amplitude_winter_c: 1.5
  diurnal_amplitude_summer_c: 5.0
  diurnal_peak_utc_h: 13.0
  national_sd_c: 3.2            # synoptic anomaly shared by all sites
  national_tau_h: 60
  local_sd_c: 0.8
  local_tau_h: 6
clear_sky_index:
  # National regime chain (hourly): stay with p_stay, else redraw from the month's distribution.
  p_stay: 0.92
  states: {clear: {mean: 0.97, sd: 0.04}, broken: {mean: 0.62, sd: 0.17}, overcast: {mean: 0.24, sd: 0.09}}
  # Monthly regime probabilities [clear, broken, overcast]; winter overcast-heavy.
  monthly: [[0.14, 0.30, 0.56], [0.20, 0.33, 0.47], [0.30, 0.38, 0.32], [0.42, 0.38, 0.20],
            [0.46, 0.38, 0.16], [0.48, 0.37, 0.15], [0.48, 0.37, 0.15], [0.47, 0.38, 0.15],
            [0.38, 0.39, 0.23], [0.26, 0.36, 0.38], [0.14, 0.31, 0.55], [0.12, 0.28, 0.60]]
  local_tau_h: 1.5
  regional_sd: 0.08
  regional_tau_h: 30
wind:
  weibull_k: 2.0
  national_share: 0.8           # correlation of the Gaussian copula with the national process
  national_tau_h: 30
  local_tau_h: 3
  shear_alpha: {household: 0.22, commercial: 0.22, industrial: 0.20, wind_farm: 0.14, solar_farm: 0.18,
                biogas_plant: 0.20, hydro_plant: 0.22}
  daytime_boost: 0.15
  prevailing_dir_deg: 250
  dir_sd_deg: 60
  dir_tau_h: 24
forecast:
  cadence_h: 3
  horizon_h: 48
  availability_delay_min: 90    # ICON-D2 runs are available ~1.5 h after initialisation
  kt_sd_base: 0.05
  kt_sd_per_sqrt_h: 0.045
  temp_sd_base_c: 0.4
  temp_sd_per_h_c: 0.045
  wind_rel_sd_base: 0.08
  wind_rel_sd_per_h: 0.004
  step_correlation: 0.97
