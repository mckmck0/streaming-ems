# Synthetic weather parameters for Poland (literature defaults; jobs/calibrate.py refits them in spec 002).
# All processes are keyed by (seed, location, variable, step); see src/ems/ingest/synthetic/weather.py.
temperature:
  annual_mean_c: 8.7            # PL mean ~8.7 C (IMGW 1991-2020)
  annual_amplitude_c: 10.0      # Jan ~ -1.3 C, Jul ~ 18.7 C
  coldest_day_of_year: 20
  continentality_c_per_deg_lon: 0.25   # amplitude grows eastwards
  lapse_c_per_m: 0.0065
  lat_gradient_c_per_deg: -0.3
  diurnal_amplitude_winter_c: 1.5
  diurnal_amplitude_summer_c: 5.0
  diurnal_peak_utc_h: 13.0
  national_sd_c: 3.2            # synoptic anomaly shared by all sites
  national_tau_h: 60
  local_sd_c: 0.8
  local_tau_h: 6
clear_sky_index:
  # National regime chain (hourly): stay with p_stay, else redraw from the month's distribution.
  p_stay: 0.92
  states: {clear: {mean: 0.97, sd: 0.04}, broken: {mean: 0.62, sd: 0.17}, overcast: {mean: 0.24, sd: 0.09}}
  # Monthly regime probabilities [clear, broken, overcast]; winter overcast-heavy.
  monthly: [[0.14, 0.30, 0.56], [0.20, 0.33, 0.47], [0.30, 0.38, 0.32], [0.42, 0.38, 0.20],
            [0.46, 0.38, 0.16], [0.48, 0.37, 0.15], [0.48, 0.37, 0.15], [0.47, 0.38, 0.15],
            [0.38, 0.39, 0.23], [0.26, 0.36, 0.38], [0.14, 0.31, 0.55], [0.12, 0.28, 0.60]]
  local_tau_h: 1.5
  regional_sd: 0.08
  regional_tau_h: 30
wind:
  weibull_k: 2.0
  national_share: 0.8           # correlation of the Gaussian copula with the national process
  national_tau_h: 30
  local_tau_h: 3
  shear_alpha: {household: 0.22, commercial: 0.22, solar_farm: 0.18}   # per site type: 100/120 m wind
  daytime_boost: 0.15
  prevailing_dir_deg: 250
  dir_sd_deg: 60
  dir_tau_h: 24
# Forecast errors (spec 007; sources and checks in specs/007-realistic-generator-data/plan.md §5 and 13).
# err_x(v, r) = sd_x(L) * (rho * Z_x(v) + sqrt(1 - rho^2) * Y_x(r, v)), L = (k + 1) * 0.25 h:
# Z is shared by every run for a valid time, Y is per run. sd_x(L) = base + per_h * L.
forecast:
  cadence_h: 3
  horizon_h: 48
  availability_delay_min: 90    # ICON-D2 runs are available ~1.5 h after initialisation
  # kt error in logit units of (kt - 0.03) / 1.07 (bounded, no clipping). Calibrated by simulation so the daylight
  # total kt error, timing included, follows hourly NWP verification: ~0.20 at 0-6 h -> ~0.23 at 48 h
  # (Perez et al. 2013 Table 9, Germany day 1-3 rRMSE 40/42/45 %; Lorenz et al. 2008, 37 -> 46 %; NWP error flat
  # over 0-5 h, Lorenz 2016; ICON-D2 noon RMSE ~175 W/m2, DWD COSMO GM 2019, Aug 2019 pre-operational, VERIFY).
  kt_sd_base: 0.95
  kt_sd_per_h: 0.002
  rho: 0.9                      # VERIFY: no published run-to-run error correlation; ECMWF jumpiness guidance
  rho_phase: 0.95               # VERIFY: no source; 0.9 put consecutive-run kt correlation at 0.73 (prototype)
  common_tau_h: 2.0             # HRRR GHI error lag-1 h corr 0.58 (arXiv 2603.04132); COSMO-DE-EPS wind 0.6-0.8
  step_correlation: 0.88        # per 15 min (tau ~ 2 h), same sources
  # Timing error of the clear-sky index: delta drawn at knots (issue time: 0, then every phase_knot_h of valid
  # time), sd = phase_sd_per_sqrt_h * sqrt(L), clipped to [-min(L, max), max], linear between knots.
  # VERIFY: no published timing sd; proxy ECMWF EPS cyclone position error ~1 deg (day 1) / 1.5 deg (day 2) at
  # 30-50 km/h along-track -> 1.5-2.6 h / 2.3-3.9 h. Knots must be >= 2 * phase_max_h apart (monotone warp).
  phase_sd_per_sqrt_h: 0.42
  phase_max_h: 6
  phase_knot_h: 12
  # ICON-D2 T2m RMSE 1.35 K (0-6 h), 1.4-1.75 K (15-27 h) (DWD 2019, Aug 2019, VERIFY winter); ECMWF TM 911
  # SYNOP error sd 2.0-2.4 K at 60-72 h.
  temp_sd_base_c: 1.3
  temp_sd_per_h_c: 0.015
  # Log-normal wind factor exp(err - sd^2/2): absolute error sd from ICON-D2 1.25 m/s (0-6 h, DWD 2019) rising to
  # ECMWF TM 911's 1.9-2.4 m/s at 60-72 h (~1.2 + 0.0135 L m/s), over a typical inland 10 m speed of 3.5 m/s
  # (VERIFY, IMGW), as sqrt(ln(1 + cv^2)).
  wind_ln_sd_base: 0.34
  wind_ln_sd_per_h: 0.0035
