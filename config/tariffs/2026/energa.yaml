# Energa-Operator (DSO) and Energa Obrót (incumbent seller), groups G11, G12, G12w, 2026 (spec 009).
# Net values; VAT, excise and the national fees are in national.yaml. Checked 2026-11-13.
#   Energa-Operator tariff 2026 (e-signed 2025-12-17; decision DRE.WPR.4211.9.8.2025.JSz, number from
#   the operator's tariff page). From 2026-10-01 no subscription fee (Dz.U. 2026 poz. 1182 § 56 ust. 3).
#   Energa Obrót tariff 2026, decision DRE.WPR.4211.8.9.2025.JSz (Biuletyn URE 270 (4800)).
# Subscription: the 1-month rate for a remote-read meter (0.74), one global assumption of spec 009.
dso: Energa
operator:
  name: Energa-Operator
  zones:
    ref: "pkt 3.2.5–3.2.6, p. 12; clock on winter time 3.2.10"
    G11: {default: all}
    G12:
      default: day
      rules:
        - {zone: night, days: [weekday, saturday, sunday, holiday], hours: [[13, 15], [22, 6]]}
    G12w:
      default: peak
      rules:
        - {zone: offpeak, days: [saturday, sunday, holiday], hours: [[0, 24]]}
        - {zone: offpeak, days: [weekday], hours: [[13, 15], [22, 6]]}
