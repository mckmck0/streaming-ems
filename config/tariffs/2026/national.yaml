# National bill components and net-billing rules for 2026 (spec 009). Config, not wire contract.
# Every value carries a `ref` into one of the documents below; all values were checked 2026-11-13.
#   VAT act art. 41 ust. 1 with art. 146ef ust. 1 (23 %).
#   Excise act art. 89 ust. 3 (consolidated Dz.U. 2026 poz. 412): 5.00 PLN/MWh, charged by the seller.
#   Informacja Prezesa URE 61/2025 (OZE fee) and 58/2025 (capacity fee); Dz.U. 2025 poz. 1664
#   (cogeneration fee); URE decision DRE.WPR.4211.1.4.2026.BTS (PSE tariff → quality fee from 02-01).
#   Act on days off work (Dz.U. 1951 nr 4 poz. 28, as amended; 24 December from 2025).
#   RES act (ustawa o OZE), consolidated Dz.U. 2026 poz. 68: art. 4 ust. 11–11a, art. 4c.
year: 2026
valid_until: 2027-01-01
sources:
  - document: "Ustawa o podatku od towarów i usług, art. 41 ust. 1, art. 146ef ust. 1"
    url: "https://isap.sejm.gov.pl/isap.nsf/DocDetails.xsp?id=WDU20040540535"
    checked: 2026-11-13
  - document: "Ustawa o podatku akcyzowym, art. 89 ust. 3 (Dz.U. 2026 poz. 412)"
    url: "https://podatki.gov.pl/akcyza/stawki-podatkowe"
    checked: 2026-11-13
  - document: "Informacja Prezesa URE nr 61/2025 (stawka opłaty OZE na 2026 r.)"
    url: "https://www.ure.gov.pl/download/9/15811/InformacjaPUREwysokosstawkioplatyOZE271025.pdf"
    checked: 2026-11-13
  - document: "Rozporządzenie Ministra Energii z 2025-11-28 (Dz.U. 2025 poz. 1664), opłata kogeneracyjna"
    url: "https://eli.gov.pl/api/acts/DU/2025/1664/text/O/D20251664.pdf"
    checked: 2026-11-13
  - document: "Decyzja Prezesa URE DRE.WPR.4211.1.4.2026.BTS z 2026-01-16 (zmiana taryfy PSE, stawka jakościowa)"
    url: "https://bip.ure.gov.pl/download/3/20436/PSE.pdf"
    checked: 2026-11-13
  - document: "Informacja Prezesa URE nr 58/2025 (stawki opłaty mocowej na 2026 r.)"
    url: "https://www.ure.gov.pl/download/9/15790/informacja582025PUREstawki2026.pdf"
    checked: 2026-11-13
  - document: "Ustawa o dniach wolnych od pracy (24 grudnia od 2025 r.)"
    url: "https://isap.sejm.gov.pl/isap.nsf/DocDetails.xsp?id=WDU19510040028"
    checked: 2026-11-13
  - document: "Ustawa o odnawialnych źródłach energii, tekst jednolity Dz.U. 2026 poz. 68"
    url: "https://api.sejm.gov.pl/eli/acts/DU/2026/68"
    checked: 2026-11-13
vat: {value: 0.23, unit: fraction, ref: "VAT act art. 41 ust. 1, art. 146ef ust. 1"}
excise: {value: 5.00, unit: PLN/MWh, ref: "excise act art. 89 ust. 3; added to every seller price (seller tariffs pkt 1.6 / 5.2)"}
oze_fee: {value: 7.30, unit: PLN/MWh, ref: "Informacja Prezesa URE 61/2025"}
cogeneration_fee: {value: 3.00, unit: PLN/MWh, ref: "Dz.U. 2025 poz. 1664 § 1"}
quality_fee:
  - id: quality-2026-01
    valid_from: 2026-01-01
    rate: {value: 0.0331, unit: PLN/kWh, ref: "DSO tariffs 2026 (Tauron 7.4, Enea 7.7 p. 8, PGE 7.9 Lp. 3, Energa 9.1), low voltage"}
  - id: quality-2026-02
    valid_from: 2026-02-01
    rate: {value: 0.0332, unit: PLN/kWh, ref: "DRE.WPR.4211.1.4.2026.BTS (k_ok 1.01577); Enea extract Jan-Sep p. 8 footnote *; DSO notices from 2026-02-01"}
capacity_fee:
  bands: {value: [500, 1200, 2800], unit: kWh, ref: "capacity market act art. 89b ust. 3; DSO tariffs (Tauron 3.1.33-3.1.34, Energa 4.1.28-4.1.29, Enea 3.1.29-3.1.30, PGE 3.1.32-3.1.33): < 500, 500–1,200 incl., > 1,200–2,800 incl., > 2,800 kWh in the year to the last reading"}
  rates: {value: [4.29, 10.31, 17.18, 24.05], unit: PLN/month, ref: "Informacja 58/2025, households (art. 89a ust. 1 pkt 1 capacity market act); same rates in every DSO tariff"}
holidays:
  ref: "act on days off work; equals holidays.Poland(years=2026)"
  dates: [2026-01-01, 2026-01-06, 2026-04-05, 2026-04-06, 2026-05-01, 2026-05-03, 2026-05-24,
          2026-06-04, 2026-08-15, 2026-11-01, 2026-11-11, 2026-12-24, 2026-12-25, 2026-12-26]
net_billing:
  deposit_factor: {value: 1.23, unit: factor, ref: "RES act art. 4c ust. 4 (every cohort since 2025-02-01)"}
  refund_cap_rcem: {value: 0.20, unit: fraction, ref: "RES act art. 4 ust. 11a: 20 % of the month's export value before 1.23 (art. 4b ust. 1 cohort)"}
  refund_cap_rce: {value: 0.30, unit: fraction, ref: "RES act art. 4 ust. 11a: 30 % of the month's export value before 1.23 (art. 4b ust. 2 cohort)"}
  validity_months: {value: 12, unit: months, ref: "RES act art. 4c ust. 5: 12 months from assignment in the next month"}
