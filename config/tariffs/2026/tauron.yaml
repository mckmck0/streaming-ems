# Tauron Dystrybucja (DSO) and Tauron Sprzedaż (incumbent seller), groups G11, G12, G12w, 2026 (spec 009).
# Net values; VAT, excise and the national fees are in national.yaml. Checked 2026-11-13.
#   Tauron Dystrybucja tariff 2026, decision DRE.WRE.4211.54.8.2025.ASa1 of 2025-12-17 (full text).
#   2026-09-01 moves prosumers to monthly billing (2.3.1a ends): no rate changes, so no version.
#   From 2026-10-01 no subscription fee (Dz.U. 2026 poz. 1182 § 56 ust. 3).
#   Tauron Sprzedaż tariff 2026, decision DRE.WRE.4211.53.10.2025.ASa1 (Biuletyn URE 265 (4795)). It
#   excludes the Gliwice area; spec 009 applies it to every Tauron site (risk D8).
dso: Tauron
operator:
  name: Tauron Dystrybucja
  zones:
    ref: "pkt 2.2.6–2.2.7, p. 12; clock on winter time 2.2.9, p. 13"
    G11: {default: all}
    G12:
      default: day
      rules:
        - {zone: night, days: [weekday, saturday, sunday, holiday], hours: [[13, 15], [22, 6]]}
    G12w:
      default: peak
      rules:
        - {zone: offpeak, days: [saturday, sunday, holiday], hours: [[0, 24]]}
        - {zone: offpeak, days: [weekday], hours: [[13, 15], [22, 6]]}
