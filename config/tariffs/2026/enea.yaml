          fixed_fee: {value: 14.56, unit: PLN/month, ref: "pkt 7.2, p. 6, 3-phase"}
          subscription_fee: {value: 0.0, unit: PLN/month, ref: "pkt 7.3, p. 7, footnote **; Dz.U. 2026 poz. 1182 § 56 ust. 3"}
