# Template. Pin every `rev` to a release at least two weeks old (VERIFY current tags).
# The ruff-pre-commit rev must match the ruff version locked in uv.lock.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^helm/.*/templates/   # Go templates are not valid YAML
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check   # older releases name this hook `ruff`
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: ty
        name: ty check
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false

      - id: uv-lock-check
        name: uv lock --check
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false

      - id: helm-lint
        name: helm lint
        entry: bash -c 'command -v helm >/dev/null || exit 0; [ -f helm/ems/Chart.yaml ] || exit 0; helm lint helm/ems'
        language: system
        files: ^helm/
        pass_filenames: false
