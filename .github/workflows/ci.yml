# CI (spec 010): `make ci` (lint, type-check, unit and property tests) on every push to main and every pull
# request. The integration, e2e and fault tiers need Docker, Kafka and Restate and run on the author's machine.
# Actions are pinned by commit SHA, each the newest release when pinned (P12). macOS arm64, like the author's
# machine: three golden digests of the generator (specs 005, 008) differ on Linux x86_64 and arm64 (risk G12).
# The workflow only reads: the coverage total goes to the job summary (no badge; the ruleset lets no bot push).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.8"
      - name: Install every dependency group from uv.lock
        run: uv sync --locked --all-groups
      - name: make ci
        run: make ci
      - name: Coverage of the unit and property tiers
        run: |
          make report-coverage
          total=$(uv run coverage report --data-file=logs/.coverage --format=total)
          echo "Line coverage of the unit and property tiers: ${total} %" >> "$GITHUB_STEP_SUMMARY"
