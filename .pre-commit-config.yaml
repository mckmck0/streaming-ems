# Pin every `rev` to a release at least two weeks old. The ruff-pre-commit rev must equal the ruff pin in
# pyproject.toml (ruff==0.16.10). The original template is in templates/.pre-commit-config.yaml.
# reference/ (spike) and docs/bootstrap/ (frozen brief) are kept byte-identical.
exclude: ^(reference|docs/bootstrap)/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^helm/.*/templates/   # Go templates are not valid YAML
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: ty
        name: ty check
        entry: uv run --locked ty check
        language: system
        types: [python]
        pass_filenames: false

      - id: uv-lock-check
        name: uv lock --check
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false

      - id: helm-lint
        name: helm lint
        entry: bash -c 'command -v helm >/dev/null || exit 0; [ -f helm/ems/Chart.yaml ] || exit 0; helm lint helm/ems'
        language: system
        files: ^helm/
        pass_filenames: false
