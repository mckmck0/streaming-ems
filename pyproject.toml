[project]
name = "ems"
version = "0.1.0"
description = "Counterfactual multi-strategy energy management on durable stateful actors (MSc thesis)"
readme = "README.md"
authors = [
    { name = "Mikolaj Wegner", email = "mikolajwegner0@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13",
    "pydantic-settings>=2.10",
    "ruamel.yaml>=0.19",
    "structlog>=26.1",
    "typer>=0.27",
    "tzdata",
]

[project.scripts]
ems-gen = "ems.ingest.cli:app"

[dependency-groups]
# Exact pins only where behaviour depends on the version: ruff must equal the ruff-pre-commit rev in
# .pre-commit-config.yaml, and ty is pre-1.0. Everything else is pinned by uv.lock.
dev = [
    "coverage>=7.17.3",
    "hypothesis",
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff==0.16.10",
    "ty==0.0.84",
]
# Restate SDK service (spec 010). Exact pins: the service protocol and the HTTP/2 serving depend on them.
actors = [
    "hypercorn==0.18.0",
    "restate-sdk==1.5.2",
]
# Data generator (spec 001+). faker is pinned exactly because its locale data feeds a golden catalog test.
ingest = [
    "confluent-kafka>=2.15.1,<2.16",
    "demandlib==0.2.2",
    "faker==40.40.0",
    "h5py>=3.16",
    "holidays>=0.105",
    "httpx>=0.28.1",
    "jsonschema>=4.26",
    "lxml>=6.1.3",
    "numpy>=2.0",
    "pandas>=2.2",
    "pvlib==0.16.1",
    "pyarrow",
    "scipy",
    "tenacity>=9.1.4",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# New and bumped pins take the newest release (spec 010); uv.lock keeps every version exact.
default-groups = ["dev", "ingest", "actors"]

[tool.ty.src]
# The reference spike is kept byte-identical (spec 010); ruff and pre-commit skip it too.
exclude = ["reference"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["reference", "docs/bootstrap"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "SIM", "RUF"]

[tool.pytest.ini_options]
addopts = ["--strict-markers", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "unit: no infrastructure",
    "property: hypothesis property tests, no infrastructure",
    "integration: real services via make up",
    "e2e: replay compared bit-exactly with the offline reference",
    "fault: kill -9 of the SDK service or the server",
]

[tool.coverage.run]
# Each tier sets COVERAGE_FILE=logs/.coverage.<tier>; `make report-coverage` combines them (spec 010).
# patch = subprocess also measures the SDK service the Restate tiers start as a child process.
source = ["ems"]
parallel = true
patch = ["subprocess"]
sigterm = true

[tool.coverage.report]
skip_empty = true

[tool.ruff.lint.per-file-ignores]
# data tables: one row per line reads better than wrapped rows
"src/ems/ingest/catalog/voivodeships.py" = ["E501"]
