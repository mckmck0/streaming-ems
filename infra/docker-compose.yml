# Local infrastructure (spec 001: Kafka; the dev-environment spec adds Restate here).
# Run through the Makefile: make up | down | reset | topics | gen. Paths are relative to infra/.
# Pins and the reasons behind each setting: docs/context/05-deploy-and-infra.md.
name: ems

services:
  kafka:
    # Apache Kafka 4.3.1 (2026-06-25), JVM image, single combined broker+controller (KRaft).
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    hostname: kafka
    # No env_file: the image turns every KAFKA_* variable into a broker property.
    environment:
      CLUSTER_ID: "bxw8hH0KW56aUi8NGmxOMg"   # fixed, not a secret; changing it needs `make reset`
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"   # static voters: the image's auto-format needs them
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Env config drops the image's single-node defaults: every internal topic needs RF 1 here.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"           # without it nothing reaches the volume
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS=-Xmx128m /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 6
      start_period: 30s
      start_interval: 2s

  kafka-init:
    build:
      context: ..
      dockerfile: infra/ems-gen.Dockerfile
    image: ems-gen:local
    command: ["topics", "ensure"]
    environment:
      EMS_KAFKA_BOOTSTRAP: "kafka:29092"
      EMS_TOPICS_PROFILE: "${EMS_TOPICS_PROFILE:-live}"
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  kafka-ui:
    # kafbat/kafka-ui v1.5.0 (2026-04-20). Shows the 4.3 broker version as "Unknown" (cosmetic).
    image: ghcr.io/kafbat/kafka-ui:v1.5.0@sha256:7cda86a33344160309fdb65146332e4da65db81a945614f2fe32e210803f6fd1
    environment:
      KAFKA_CLUSTERS_0_NAME: "local"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:29092"
      KAFKA_CLUSTERS_0_READONLY: "true"            # topics are owned by `ems-gen topics ensure`
      DYNAMIC_CONFIG_ENABLED: "false"
      GITHUB_RELEASE_INFO_ENABLED: "false"
    ports:
      - "127.0.0.1:8088:8080"                      # 8080 is reserved for the Restate ingress
    depends_on:
      kafka-init:
        condition: service_completed_successfully  # also makes `up --wait` wait for the one-shot job
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ems-gen:
    build:
      context: ..
      dockerfile: infra/ems-gen.Dockerfile
    image: ems-gen:local
    profiles: ["gen"]
    command: ["run", "--mode", "realtime"]
    environment:
      EMS_KAFKA_BOOTSTRAP: "kafka:29092"
      EMS_TOPICS_PROFILE: "${EMS_TOPICS_PROFILE:-live}"
      EMS_DATA_DIR: "/data"
    env_file:
      - path: ../.env
        required: false
    volumes:
      - ../config:/app/config:ro
      - ../mappings:/app/mappings:ro
      - ../data:/data
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  kafka-data:
