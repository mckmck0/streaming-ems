# Local infrastructure: Kafka (spec 001) and Restate with the Kafka ingress integration (spec 010).
# Run through the Makefile: make up | register | down | reset | topics | gen. Paths are relative to infra/.
# Pins and the reasons behind each setting: docs/context/05-deploy-and-infra.md.
name: ems

# Kafka ingress integration (spec 010): one container per target handler, in the `ingress` profile, so only
# `make register` starts them (after the SDK service is registered) and `make down` removes them. Topic names and
# group ids take ${EMS_INGRESS_PREFIX}, which test projects set (tests/compose.it.yml); the stack leaves it empty.
x-ingress-env: &ingress-env
  KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
  KAFKA_AUTO_OFFSET_RESET: "earliest"        # the integration sets none; Kafka's `latest` would skip existing data
  RESTATE_INGRESS_URL: "http://restate:8080"
  RESTATE_RETRY_MAX_ATTEMPTS: "${EMS_INGRESS_RETRY_MAX_ATTEMPTS:-15}"   # then the process exits; restart below
  JDK_JAVA_OPTIONS: "-Xmx256m"

x-ingress: &ingress
  # ingress-integration-kafka 0.1.1, newest build (2026-11-09). linux/amd64 only: emulated on Apple Silicon.
  image: ghcr.io/restatedev/ingress-integration-kafka:0.1.1-20261109@sha256:20704c886ee4dcc4046bab1743dc424bb08b2317ce1bc6da55ce738345ce01b1
  platform: linux/amd64
  profiles: ["ingress"]
  labels:
    ems.role: "ingress"                      # `make down` and `make reset` remove every container with this label
  restart: unless-stopped
  mem_limit: 768m
  healthcheck:
    # The metrics port (9464) answers once the JVM runs. bash, not CMD-SHELL: /bin/sh is dash, without /dev/tcp.
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9464"]
    interval: 5s
    timeout: 5s
    retries: 24
    start_period: 90s
    start_interval: 2s

services:
  kafka:
    # Apache Kafka 4.3.1 (2026-06-25), JVM image, single combined broker+controller (KRaft).
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    hostname: kafka
    # No env_file: the image turns every KAFKA_* variable into a broker property.
    environment:
      CLUSTER_ID: "bxw8hH0KW56aUi8NGmxOMg"   # fixed, not a secret; changing it needs `make reset`
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"   # static voters: the image's auto-format needs them
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Env config drops the image's single-node defaults: every internal topic needs RF 1 here.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"           # without it nothing reaches the volume
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS=-Xmx128m /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 6
      start_period: 30s
      start_interval: 2s

  kafka-init:
    build:
      context: ..
      dockerfile: infra/ems-gen.Dockerfile
    image: ems-gen:local
    command: ["topics", "ensure"]
    environment:
      EMS_KAFKA_BOOTSTRAP: "kafka:29092"
      EMS_TOPICS_PROFILE: "${EMS_TOPICS_PROFILE:-live}"
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  kafka-ui:
    # kafbat/kafka-ui v1.5.0 (2026-04-20). Shows the 4.3 broker version as "Unknown" (cosmetic).
    image: ghcr.io/kafbat/kafka-ui:v1.5.0@sha256:7cda86a33344160309fdb65146332e4da65db81a945614f2fe32e210803f6fd1
    environment:
      KAFKA_CLUSTERS_0_NAME: "local"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:29092"
      KAFKA_CLUSTERS_0_READONLY: "true"            # topics are owned by `ems-gen topics ensure`
      DYNAMIC_CONFIG_ENABLED: "false"
      GITHUB_RELEASE_INFO_ENABLED: "false"
    ports:
      - "127.0.0.1:8088:8080"                      # 8080 is reserved for the Restate ingress
    mem_limit: 512m                                # peak 405 MiB; every long-running service has a limit (spec 012)
    depends_on:
      kafka-init:
        condition: service_completed_successfully  # also makes `up --wait` wait for the one-shot job
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ems-gen:
    build:
      context: ..
      dockerfile: infra/ems-gen.Dockerfile
    image: ems-gen:local
    profiles: ["gen"]
    command: ["run", "--mode", "realtime"]
    environment:
      EMS_KAFKA_BOOTSTRAP: "kafka:29092"
      EMS_TOPICS_PROFILE: "${EMS_TOPICS_PROFILE:-live}"
      EMS_DATA_DIR: "/data"
    env_file:
      - path: ../.env
        required: false
    volumes:
      - ../config:/app/config:ro
      - ../mappings:/app/mappings:ro
      - ../data:/data
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  restate:
    # Restate 1.8.1-hotfix.2 (2026-11-02), the newest release. One node; the SDK service runs on the host
    # (`make dev`, 127.0.0.1:9080) and is registered as host.docker.internal:9080 (`make register`).
    image: restatedev/restate:1.8.1-hotfix.2-20261102@sha256:e3a11e7c694cfe0c134eca1652992c068bef0bcba3caeec9d2a3b3bc50daa62e
    hostname: restate
    environment:
      RESTATE_NODE_NAME: "restate-1"         # fixed: the node finds its data under /restate-data/<node name>
      RESTATE_CLUSTER_NAME: "ems"
      RESTATE_ROCKSDB_TOTAL_MEMORY_SIZE: "512 MiB"
      # The other memory pools default to 1.5 GiB (invoker), 1 GiB (query engine) and 250 MiB (Bifrost record
      # cache), above mem_limit together. Their sum here (1.5 GiB) plus the runtime stays under it
      # (https://docs.restate.dev/server/memory; spec 012, risk K15).
      RESTATE_WORKER__INVOKER__MEMORY_LIMIT: "512 MiB"
      RESTATE_ADMIN__QUERY_ENGINE__MEMORY_SIZE: "384 MiB"
      RESTATE_BIFROST__RECORD_CACHE_MEMORY_SIZE: "128 MiB"
      # Journals of completed invocations: 1 d in development, 0 in experiments and live (spec 012, risk A6).
      RESTATE_DEFAULT_JOURNAL_RETENTION: "${EMS_RESTATE_JOURNAL_RETENTION:-1d}"
    ports:
      - "127.0.0.1:8080:8080"                  # ingress
      - "127.0.0.1:9070:9070"                  # admin API and UI
    extra_hosts:
      - "host.docker.internal:host-gateway"    # the SDK service on the host (needed on Linux engines)
    volumes:
      - restate-data:/restate-data
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:9070/health && curl -fsS -o /dev/null http://127.0.0.1:8080/restate/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
      start_interval: 1s

  ingress-meters:
    <<: *ingress
    environment:
      <<: *ingress-env
      KAFKA_TOPICS: "${EMS_INGRESS_PREFIX:-}ems.production.v1,${EMS_INGRESS_PREFIX:-}ems.consumption.v1"
      KAFKA_GROUP_ID: "${EMS_INGRESS_PREFIX:-}ems-ingress-meters"
      RESTATE_RECORD_MAPPER_SERVICE: "Household"      # spec 011: the actors (spec 010: Probe)
      RESTATE_RECORD_MAPPER_HANDLER: "on_measurement"
      RESTATE_KAFKA_CONSUMER_INSTANCES: "3"   # never more than the partitions read (2 topics x 3 in live/sim)

  ingress-forecasts:
    <<: *ingress
    environment:
      <<: *ingress-env
      KAFKA_TOPICS: "${EMS_INGRESS_PREFIX:-}ems.weather.forecast.v1"
      KAFKA_GROUP_ID: "${EMS_INGRESS_PREFIX:-}ems-ingress-forecasts"
      RESTATE_RECORD_MAPPER_SERVICE: "Weather"
      RESTATE_RECORD_MAPPER_HANDLER: "on_forecast"
      RESTATE_KAFKA_CONSUMER_INSTANCES: "3"

  ingress-prices:
    <<: *ingress
    environment:
      <<: *ingress-env
      KAFKA_TOPICS: "${EMS_INGRESS_PREFIX:-}ems.price.v1"
      KAFKA_GROUP_ID: "${EMS_INGRESS_PREFIX:-}ems-ingress-prices"
      RESTATE_RECORD_MAPPER_SERVICE: "Tariff"
      RESTATE_RECORD_MAPPER_HANDLER: "on_price"
      RESTATE_KAFKA_CONSUMER_INSTANCES: "1"   # the price topic has one partition in live and sim

volumes:
  kafka-data:
  restate-data:
